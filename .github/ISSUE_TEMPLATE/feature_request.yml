name: ✨ Feature Request
description: Suggest a new feature or improvement for SahiDawa.
title: "[FEATURE] <Brief description>"
labels: ["type:feature"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Suggest a Feature! 🚀
        SahiDawa collects medicine data and serves barcode lookups. Ideas for new sources, better data or the API are welcome.

  - type: dropdown
    id: area
    attributes:
      label: Which area does this feature belong to?
      options:
        - "Scraping pipeline (apps/etl)"
        - "Barcode API (apps/barcode-api)"
        - "Database schema (supabase/)"
        - "CI / workflows"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Estimated Difficulty
      description: How complex is this feature to implement?
      options:
        - "🟢 Good First Issue — Beginner friendly"
        - "🟡 Intermediate — Some experience needed"
        - "🔴 Advanced — Complex implementation"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user problem or gap this feature addresses.
      placeholder: "Most scanned barcodes return unknown because nothing fills product_barcodes..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see implemented.
      placeholder: "Add a scraper that looks up the most-scanned entries in unknown_barcode_scans..."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know this feature is done? (Optional but very helpful)
      placeholder: |
        - [ ] run_all.py loads the new source with 0 failed rows
        - [ ] A second run changes no row counts
        - [ ] Tests cover the new scraper
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I have read and agree to SahiDawa's [Code of Conduct](https://github.com/RatLoopz/sahidawa-india/blob/main/CODE_OF_CONDUCT.md).
          required: true
