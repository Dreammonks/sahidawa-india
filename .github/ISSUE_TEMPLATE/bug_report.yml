name: 🐛 Bug Report
description: Report a bug or broken functionality in SahiDawa.
title: "[BUG] <Brief description>"
labels: ["type:bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for reporting a bug! 🩺
        Please check existing issues first to avoid duplicates.

  - type: dropdown
    id: area
    attributes:
      label: Which part of SahiDawa is broken?
      description: Select the area where you found the bug.
      options:
        - "Scraping pipeline (apps/etl)"
        - "API (apps/barcode-api)"
        - "Database schema (supabase/)"
        - "Other / Unknown"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe what went wrong.
      placeholder: "GET /api/v1/products/barcode/8901234567890 returns 500 instead of an unknown result..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: "The API should return 200 with status unknown and queue the barcode."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste the request and response, the pipeline log, or the failing test output.
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I have read and agree to SahiDawa's [Code of Conduct](https://github.com/RatLoopz/sahidawa-india/blob/main/CODE_OF_CONDUCT.md).
          required: true
