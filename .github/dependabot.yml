version: 2
updates:
    # Barcode API and the workspace root
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5
      groups:
          dependencies:
              patterns:
                  - "*"

    # Scraping pipeline
    - package-ecosystem: "pip"
      directory: "/apps/etl"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5
      groups:
          python-dependencies:
              patterns:
                  - "*"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5
      groups:
          actions:
              patterns:
                  - "*"
