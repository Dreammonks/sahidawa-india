name: ETL Pipeline (Medicines, Drug Alerts)

on:
  schedule:
    # Daily at 02:00 UTC (7:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-medicine-etl:
    name: 'Medicine ETL (daily)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install ETL dependencies
        working-directory: apps/etl
        run: uv sync

      - name: Install Playwright browsers
        working-directory: apps/etl
        run: uv run playwright install --with-deps chromium

      - name: Run medicine ETL pipeline
        working-directory: apps/etl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run python run_all.py

  # Separate from the medicine job so a failure on one source never stops the other.
  run-drug-alerts:
    name: 'CDSCO Drug Alerts (daily)'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install ETL dependencies
        working-directory: apps/etl
        run: uv sync

      - name: Load the latest drug alerts
        working-directory: apps/etl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run python run_alerts.py
