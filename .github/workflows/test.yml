name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    etl:
        name: ETL (pytest)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install dependencies
              working-directory: apps/etl
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"
                  pip install -r requirements.txt

            - name: Run tests
              working-directory: apps/etl
              run: python -m pytest tests -q

    barcode-api:
        name: Barcode API (jest)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - run: npm ci

            - name: Type check
              working-directory: apps/barcode-api
              run: npx tsc --noEmit

            - name: Run tests
              working-directory: apps/barcode-api
              run: npx jest --forceExit

            - name: Circular dependency scan
              run: npm run lint:circular

            - name: Audit
              run: npm run audit:node
